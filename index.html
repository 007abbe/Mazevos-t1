<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pixel art, so it ships as a PNG rather than an SVG and is upscaled with
         nearest-neighbour: the badge outline is one pixel wide and any smoothing
         turns it to mush at the 16px a tab actually renders. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazevo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
